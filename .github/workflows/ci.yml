name: CareerOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/type-contracts-and-ci]

permissions:
  contents: read

concurrency:
  group: careeros-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install from frozen Bun lockfile
        run: npm exec --yes --package=bun@1.4.3 -- bun install --frozen-lockfile
      - name: Typecheck
        run: npm run lint
      - name: Matching regression tests
        run: npx --no-install tsx --test tests/matchingEngine.test.ts
      - name: Build
        run: npm run build
